name: Hermes FSM Enforcer & Agentic Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  fsm-enforcement:
    name: Autonomous FSM Architect
    runs-on: ubuntu-latest
    env:
      # The deterministic preflight below is the enforcement gate. The LLM
      # review is advisory and only runs when a key is configured, so a missing
      # secret can never keep this check red.
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Pre-Flight FSM Path Validator (Hard Guardrails)
        id: preflight
        run: |
          echo "Executing Level 1 FSM Boundary Checks..."
          VIOLATIONS=0
          
          # FSM State 2 Banned Files (Distro targets cannot hold runtime assets)
          BANNED_DISTRO_FILES="extractFilesystem.sh|addNonRootUser.sh|termuxvoid-shim.sh|busybox|tvrun"
          
          for target in bootstrap/*/; do
            DISTRO=$(basename "$target")
            
            if [ "$DISTRO" = "core" ]; then
              continue
            fi
            
            # Boundary Breach 1: Assets folder inside a distro target
            if [ -d "$target/assets" ]; then
              echo "::error file=$target/assets,line=1,title=FSM Structural Violation::Distro targets ($DISTRO) MUST NOT contain an 'assets/' directory."
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
            
            # Boundary Breach 2: Agnostic support binaries/scripts in distro target.
            # Scan recursively: a depth-limited scan (-maxdepth 2) silently missed
            # banned files nested like input/support/addNonRootUser.sh (depth 3).
            for file in $(find "$target" -type f 2>/dev/null); do
              if echo "$file" | grep -Eq "$BANNED_DISTRO_FILES"; then
                echo "::error file=$file,line=1,title=FSM Logic Violation::Agnostic script '$(basename "$file")' found in '$DISTRO'. Must reside in 'bootstrap/core/'."
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            done
          done
          
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Pre-flight FSM validation failed. Rejecting PR immediately to save LLM compute."
            exit 1
          fi
          echo "Pre-flight passed. Proceeding to Agentic diff analysis."

      - name: 🧠 Agentic Architect Review (LLM Diff Parser)
        if: env.HAS_OPENAI_API_KEY == 'true'
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Use gpt-4o for high-reasoning complex diff analysis
          LLM_MODEL: "gpt-4o"
        with:
          script: |
            const fs = require('fs');
            const { owner, repo, number: pull_number } = context.issue;
            
            // 1+2. Fetch modified files (paginated). The whole-PR diff media type
            // 406s once a PR touches >300 files, so walk the files API instead;
            // each entry carries its own per-file patch.
            const files = [];
            for (let page = 1; ; page++) {
              const { data: pageFiles } = await github.rest.pulls.listFiles({
                owner,
                repo,
                pull_number,
                per_page: 100,
                page
              });
              files.push(...pageFiles);
              if (pageFiles.length < 100) break;
            }

            if (!files || files.length === 0) {
              console.log("No diff found. Exiting.");
              return;
            }

            const diffData = files
              .filter(f => typeof f.patch === 'string' && f.patch.length > 0)
              .map(f => `diff --git a/${f.filename} b/${f.filename}\n${f.patch}`)
              .join('\n');

            const fileList = files.map(f => f.filename).join('\n');
            
            // 3. Construct the Monolithic FSM Inject Payload
            const systemPrompt = `
            You are the Principal Architect overseeing a repository managed by an autonomous coding agent named 'Hermes'.
            Hermes generates code via a terminal emulator environment and frequently attempts to deploy execution wrappers.
            Your job is to parse the provided git diff, validate it against the Finite State Machine (FSM) rules below, and generate actionable, machine-readable JSON feedback for Hermes.
            
            CRITICAL FSM ARCHITECTURE:
            
            [STATE 1: AGNOSTIC CORE]
            - Path Space: \`bootstrap/core/\` and \`bootstrap/core/assets/\`
            - Mandate: Universal execution layers, FHS mapping routines, and chroot bootstrapping.
            - Examples: \`termuxvoid-shim.sh\`, \`extractFilesystem.sh\`, busybox binaries.
            - Rule: These scripts MUST NEVER be duplicated across distro folders. They act as the universal host layer.
            
            [STATE 2: DISTRO TARGETS]
            - Path Space: \`bootstrap/$DISTRO/\` (e.g., \`ubuntu\`, \`arch\`, \`alpine\`)
            - Mandate: Dumb configuration targets. Only defines what is inside the rootfs.
            - Examples: \`Dockerfile\`, \`main.sh\` (package manifests like apt/pacman configs).
            - Rule: Distro targets CANNOT contain shell execution wrappers, translation layers, or an \`assets/\` directory.
            
            [STATE 3: ASSEMBLY PIPELINE]
            - Path Space: \`.github/workflows/\` or root \`build.sh\`
            - Mandate: Packaging STATE 1 and STATE 2 into a single deployable tarball.
            
            EVALUATION DIRECTIVE:
            Review the diff. If Hermes has violated ANY boundary (e.g., writing Termux/FHS shim logic into a Ubuntu-specific \`main.sh\` instead of the core agnostic layer, or creating redundant asset scripts), you must output a JSON array of specific violation objects.
            
            OUTPUT FORMAT:
            You must output ONLY valid, parsable JSON. No markdown wrappers, no conversational text.
            Schema:
            [
              {
                "file": "path/to/violating/file",
                "line": <line_number_in_diff>,
                "body": "FSM VIOLATION [STATE X]: <Machine-readable instruction for Hermes to scrape and execute, e.g., 'rm path/to/file && mv ...'>"
              }
            ]
            If there are no violations, output an empty array: []
            `;

            const userPrompt = `
            FILES MODIFIED:
            ${fileList}
            
            RAW PR DIFF:
            ${diffData}
            `;

            console.log("Transmitting payload to LLM Architect...");

            // 4. Execute LLM FSM Evaluation
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: process.env.LLM_MODEL,
                messages: [
                  { role: "system", content: systemPrompt },
                  { role: "user", content: userPrompt }
                ],
                temperature: 0.1 // Low temp for strict deterministic rule checking
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`LLM API Request Failed: ${response.status} - ${errorText}`);
            }

            const jsonResponse = await response.json();
            const rawContent = jsonResponse.choices[0].message.content.trim();
            
            let reviews = [];
            try {
              // Strip potential markdown block ticks if the model hallucinates them despite instructions
              const cleanedContent = rawContent.replace(/^```json\s*/, '').replace(/\s*```$/, '');
              reviews = JSON.parse(cleanedContent);
            } catch (e) {
              console.error("Failed to parse LLM response as JSON:", rawContent);
              throw new Error("Architect returned invalid JSON format.");
            }

            if (reviews.length === 0) {
              console.log("FSM Architecture compliant. No violations detected.");
              return;
            }

            console.log(`Detected ${reviews.length} FSM violations. Posting feedback for Hermes...`);

            // 5. Post surgical inline PR comments for Hermes to parse
            let reviewBody = "🚨 **FSM Architecture Violations Detected**\n\nHermes, execute the following correction directives immediately:\n";
            const comments = [];

            for (const review of reviews) {
              reviewBody += `- \`${review.file}\`: ${review.body}\n`;
              
              // Only post line comments if the file is part of the current PR scope
              const fileContext = files.find(f => f.filename === review.file);
              if (fileContext) {
                comments.push({
                  path: review.file,
                  position: 1, // Fallback to top of file if diff line logic is overly complex
                  body: review.body
                });
              }
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              body: reviewBody,
              event: 'REQUEST_CHANGES',
              comments: comments.length > 0 ? comments : undefined
            });

            console.log("Review posted. Failing workflow to enforce FSM boundaries.");
            core.setFailed("FSM Architecture violated. See PR review for Hermes's instructions.");

      - name: ℹ️ Skip LLM review (no OPENAI_API_KEY configured)
        if: env.HAS_OPENAI_API_KEY != 'true'
        run: |
          echo "OPENAI_API_KEY is not set as a repository secret."
          echo "Deterministic FSM preflight still enforced; LLM diff review skipped."

