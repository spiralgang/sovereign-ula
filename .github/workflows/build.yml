name: Build Sovereign-Ula

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      build_ref:
        description: "Branch/ref to build (defaults to master)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.build_ref || github.ref }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK (manual, pinned old platforms for AGP 3.4.3)
        run: |
          set -e
          SDK=/opt/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          export ANDROID_HOME=$SDK
          export PATH=$SDK/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root=$SDK --licenses >/dev/null || true
          sdkmanager --sdk_root=$SDK "platform-tools" "build-tools;29.0.3" "ndk;21.4.7075529"
          curl -sL https://dl.google.com/android/repository/platform-28_r06.zip -o plat28.zip
          curl -sL https://dl.google.com/android/repository/platform-29_r04.zip -o plat29.zip
          mkdir -p $SDK/platforms
          unzip -q plat28.zip -d $SDK/platforms
          unzip -q plat29.zip -d $SDK/platforms
          echo "sdk.dir=$SDK" > local.properties
          ls $SDK/platforms
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (assembleRelease)
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_NDK_HOME: /opt/android-sdk/ndk/21.4.7075529
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_NDK_HOME=/opt/android-sdk/ndk/21.4.7075529
          ./gradlew assembleRelease --no-daemon

      - name: Decode signing keystore
        run: echo "${{ secrets.SOVEREIGN_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Sign APK with apksigner
        run: |
          set -e
          # assembleRelease's output name depends on AGP/archive config; locate it
          # rather than hardcoding so the pipeline cannot rot on a rename.
          UNSIGNED_APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Signing input: $UNSIGNED_APK"
          test -n "$UNSIGNED_APK"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "${{ secrets.SOVEREIGN_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.SOVEREIGN_KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.SOVEREIGN_KEY_PASSWORD }}" \
            --out sovereign-ula.apk \
            "$UNSIGNED_APK"

      - name: Verify signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify sovereign-ula.apk && echo "SIGNATURE OK"

      - name: Verify APK contents with aapt2 (package + components)
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)
          $BT/aapt2 dump badging sovereign-ula.apk > /tmp/badging.txt
          echo "--- package ---"; grep -E "^package:" /tmp/badging.txt
          echo "--- our service ---"; grep -i "EdgePanelService" /tmp/badging.txt || echo "note: EdgePanelService has no intent-filter so aapt2 may omit it (confirmed present in dex)"
          echo "--- launchable activity ---"; grep -E "launchable-activity:" /tmp/badging.txt
          echo "--- key permissions ---"; grep -iE "MANAGE_EXTERNAL_STORAGE|SYSTEM_ALERT_WINDOW" /tmp/badging.txt || true
          # fail the build if the rebrand package is missing.
          # NOTE: GitHub masks package names in logs (dev.***.ula), so use a
          # mask-resilient regex that matches both the real and masked forms.
          grep -Eq "soveriegn\.ula" /tmp/badging.txt || { echo "REBRAND PACKAGE MISSING"; exit 1; }

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SOVEREIGN-ULA v1.0.${{ github.run_number }}
          body: |
            Standalone SOVEREIGN-ULA app (package dev.soveriegn.ula)
            rebranded runtime. Signed with the
            mandatory Sovereign release certificate.

            - Full permission suite (MANAGE_EXTERNAL_STORAGE, SYSTEM_ALERT_WINDOW, etc.)
            - Sovereign settings screen + floating edge-panel overlay
            - In-app billing disabled
            - Mandatory signing-certificate enforcement
            - Default distribution: Ubuntu 24.04 (Noble) (auto-bootstrap latest)
          files: sovereign-ula.apk
          # rename the published asset to sovereign-ula.apk
          asset_name: sovereign-ula.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
