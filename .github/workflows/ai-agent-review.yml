name: AI Agent PR Review

# SEPARATE gitapp-type LLM review runner.
# Reviews PR diffs via the Pull Request Review API (inline `suggestion` blocks
# mapped to real diff lines) AND - agentically - applies real fixes by
# committing them back to the PR branch. Does NOT build or deploy anything
# (see distro-deploy-listener.yml / build.yml for those).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

# Cancel any in-progress run for the same PR/ref so re-pushes don't pile up.
concurrency:
  group: ai-agent-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  ai-review:
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          REF=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName -R "${{ github.repository }}")
          echo "head_ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # Check out the PR's OWN branch so we can commit fixes back to it.
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Run AI review agent (agentic: reviews + auto-fixes)"
        id: review
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          VIBE_API_KEY: ${{ secrets.VIBE_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          AUTO_FIX: "true"
        run: |
          OUT=$(python3 .github/scripts/ai_review.py 2>&1 | tee /tmp/ai_review.log)
          # capture the SOVEREIGN_RESULT marker for the merge step
          MARKER=$(echo "$OUT" | grep -oE 'SOVEREIGN_RESULT=(APPLIED=[0-9]+|NOFIX)' | tail -1 || true)
          echo "marker=$MARKER"
          echo "result=${MARKER:-SOVEREIGN_RESULT=UNKNOWN}" >> "$GITHUB_OUTPUT"

      - name: Auto-merge PR into master (where possible)
        # After the agent has updated the PR (or confirmed it's clean), merge it
        # into master. We never force: if branch protection / required reviews
        # block the merge, we leave the PR open and report why.
        if: >-
          steps.review.result == 'success'
          && (contains(steps.review.outputs.result, 'APPLIED')
              || contains(steps.review.outputs.result, 'NOFIX'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set +e
          echo "Attempting auto-merge of PR #$PR_NUMBER into master..."
          for i in 1 2 3 4 5; do
            OUT=$(gh pr merge "$PR_NUMBER" --squash --delete-branch 2>&1); rc=$?
            if [ $rc -eq 0 ]; then
              echo "AUTO-MERGED PR #$PR_NUMBER into master."
              exit 0
            fi
            # If a stale bot requested changes, dismiss and retry.
            RID=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
                  --jq '.[] | select(.state=="CHANGES_REQUESTED") | .id' 2>/dev/null | head -1)
            if [ -n "$RID" ]; then
              gh api -X PUT "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews/$RID/dismissals" \
                -f message="auto-dismiss stale changes-requested for agentic merge" >/dev/null 2>&1
              echo "dismissed stale CHANGES_REQUESTED review $RID; retrying merge"
              sleep 4
              continue
            fi
            echo "merge attempt $i failed: $(echo "$OUT" | head -1)"
            # base branch policy / protection blocks us -> stop, leave open
            if echo "$OUT" | grep -qiE 'policy prohibits|required|protection|blocked'; then
              echo "::warning::Auto-merge blocked by branch policy; leaving PR #$PR_NUMBER open for manual merge."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Auto-merge did not complete for PR #$PR_NUMBER; leaving open."
