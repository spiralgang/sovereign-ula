name: Distro Deploy Listener

# Builds OUR Sovereign-ULA distro rootfs from OUR bootstrap/ source (Noble,
# latest-rolling) and publishes the artifacts as release assets on OUR repo
# (spiralgang/sovereign-ula). NO tech.ula / UserLAnd assets are used.
#
# The app fetches distro assets from:
#   repos/spiralgang/sovereign-ula/releases/<distro>
# looking for <arch>-rootfs.tar.gz / <arch>-assets.tar.gz / <arch>-assets.txt
# where <arch> in {arm64, arm, x86_64, x86}.
#
# SEPARATE from build.yml (APK) and ai-agent-review.yml — plain build pipeline,
# NO LLM / code review.

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "Distro to build (ubuntu | debian | arch)"
        required: true
        default: "ubuntu"
      suite:
        description: "Release tag for the published assets (e.g. ubuntu | debian | arch)"
        required: false
        default: "ubuntu"

permissions:
  contents: write

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-arch emulation (runner already has Docker)
        run: |
          docker version >/dev/null 2>&1 || { echo "::error::Docker not available on runner"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build chosen distro rootfs (all arches)
        run: |
          set -euo pipefail
          DISTRO="${{ github.event.inputs.distro }}"
          if [ ! -d "bootstrap/$DISTRO" ]; then
            echo "::error::No bootstrap source for distro '$DISTRO'. Available:"; ls bootstrap
            exit 1
          fi
          echo "Building OUR $DISTRO Noble rootfs (all arches) from bootstrap/$DISTRO"
          mkdir -p release
          for ARCH in arm64 arm x86_64 x86; do
            echo "== build $ARCH =="
            ( cd "bootstrap/$DISTRO" && bash build.sh "$ARCH" )
            # build.sh writes bootstrap/$DISTRO/release/<ARCH>-rootfs.tar.gz
            # + <ARCH>-assets.tar.gz / <ARCH>-assets.txt
            cp "bootstrap/$DISTRO/release/${ARCH}-rootfs.tar.gz" "release/${ARCH}-rootfs.tar.gz"
            cp "bootstrap/$DISTRO/release/${ARCH}-assets.tar.gz" "release/${ARCH}-assets.tar.gz" 2>/dev/null || true
            if [ -f "bootstrap/$DISTRO/release/${ARCH}-assets.txt" ]; then
              cp "bootstrap/$DISTRO/release/${ARCH}-assets.txt" "release/${ARCH}-assets.txt"
            else
              : > "release/${ARCH}-assets.txt"
            fi
            # sanity: rootfs must be a real tarball, not the placeholder
            sz=$(stat -c%s "release/${ARCH}-rootfs.tar.gz")
            echo "  $ARCH rootfs size = $sz bytes"
            if [ "$sz" -lt 1000000 ]; then
              echo "::error::rootfs for $ARCH looks wrong (${sz} bytes); build.sh failed"
              exit 1
            fi
          done
          ls -la release/

      - name: Publish rootfs assets to OUR repo
        uses: softprops/action-gh-release@v2
        with:
          repository: spiralgang/sovereign-ula
          tag_name: ${{ github.event.inputs.suite }}
          name: "distro ${{ github.event.inputs.suite }} (Noble, latest)"
          body: |
            On-demand Sovereign-ULA distro rootfs built from OUR `bootstrap/${{ github.event.inputs.distro }}` (Ubuntu 24.04 Noble, latest-rolling). Pulled by the app when a user selects this distro.
          files: |
            release/arm64-rootfs.tar.gz
            release/arm-rootfs.tar.gz
            release/x86_64-rootfs.tar.gz
            release/x86-rootfs.tar.gz
            release/arm64-assets.tar.gz
            release/arm-assets.tar.gz
            release/x86_64-assets.tar.gz
            release/x86-assets.tar.gz
            release/arm64-assets.txt
            release/arm-assets.txt
            release/x86_64-assets.txt
            release/x86-assets.txt
          token: ${{ secrets.GITHUB_TOKEN }}
